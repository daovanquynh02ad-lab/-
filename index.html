// автоопределяем, мульти или нет
questions.forEach(q => {
  if (typeof q.multi === "undefined") {
    q.multi = q.correct.length > 1;
  }
});

let current = 0;
const chosen = questions.map(() => []);

const els = {
  qNumber: document.getElementById("question-number"),
  qId: document.getElementById("question-id"),
  qText: document.getElementById("question-text"),
  options: document.getElementById("options"),
  status: document.getElementById("status"),
  progress: document.getElementById("progress"),
  prev: document.getElementById("prev-btn"),
  next: document.getElementById("next-btn"),
  check: document.getElementById("check-btn"),
  reset: document.getElementById("reset-btn"),
  multiHint: document.getElementById("multi-hint"),
  topProgress: document.getElementById("top-progress"),
  showRight: document.getElementById("show-right-btn"),
  checkAll: document.getElementById("check-all-btn")
};

function renderQuestion() {
  const q = questions[current];
  els.qNumber.textContent = `Вопрос ${current + 1} из ${questions.length}`;
  els.qId.textContent = `№${q.id}`;
  els.qText.textContent = q.text;
  els.status.textContent = "Сделай свой выбор и нажми «Проверить ответ».";
  els.status.className = "status info";
  els.options.innerHTML = "";

  els.multiHint.style.display = q.multi ? "block" : "none";

  const type = q.multi ? "checkbox" : "radio";
  const selected = new Set(chosen[current]);

  q.options.forEach((opt, idx) => {
    if (!opt) return;
    const li = document.createElement("li");
    li.className = "option";

    const label = document.createElement("label");
    label.style.display = "flex";
    label.style.alignItems = "center";
    label.style.gap = "8px";
    label.style.width = "100%";

    const input = document.createElement("input");
    input.type = type;
    input.name = "qopts";
    input.value = idx;
    input.checked = selected.has(idx);
    input.addEventListener("change", () => {
      if (q.multi) {
        if (input.checked) {
          if (!chosen[current].includes(idx)) chosen[current].push(idx);
        } else {
          chosen[current] = chosen[current].filter(v => v !== idx);
        }
      } else {
        chosen[current] = input.checked ? [idx] : [];
        const inputs = document.querySelectorAll('input[name="qopts"]');
        inputs.forEach(i => { if (i !== input) i.checked = false; });
      }
    });

    const span = document.createElement("span");
    span.textContent = `${idx + 1}) ${opt}`;
    span.className = "option-label-text";

    label.appendChild(input);
    label.appendChild(span);
    li.appendChild(label);
    els.options.appendChild(li);
  });

  els.prev.disabled = current === 0;
  els.next.disabled = current === questions.length - 1;

  const answeredCount = chosen.filter(a => a.length > 0).length;
  els.progress.textContent = `Отвечено на ${answeredCount} из ${questions.length} вопросов`;
  els.topProgress.textContent = `Прогресс: ${answeredCount}/${questions.length}`;
}

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  const aa = [...a].sort();
  const bb = [...b].sort();
  return aa.every((v, i) => v === bb[i]);
}

function clearHighlights() {
  [...els.options.children].forEach(li => {
    li.classList.remove("correct", "wrong");
  });
}

function checkAnswer() {
  const q = questions[current];
  const answer = chosen[current];
  clearHighlights();

  if (answer.length === 0) {
    els.status.textContent = "Сначала выбери вариант(ы) ответа.";
    els.status.className = "status bad";
    return;
  }

  const isCorrect = arraysEqual(answer, q.correct);
  els.status.className = "status " + (isCorrect ? "ok" : "bad");
  els.status.textContent = isCorrect ? "Верно! 🔥" : "Есть ошибка. Посмотри подсветку.";

  [...els.options.children].forEach((li, idx) => {
    const isRight = q.correct.includes(idx);
    const isChosen = answer.includes(idx);
    if (isRight) li.classList.add("correct");
    if (isChosen && !isRight) li.classList.add("wrong");
  });

  const answeredCount = chosen.filter(a => a.length > 0).length;
  els.progress.textContent = `Отвечено на ${answeredCount} из ${questions.length} вопросов`;
  els.topProgress.textContent = `Прогресс: ${answeredCount}/${questions.length}`;
}

function showRightAnswer() {
  const q = questions[current];
  const answer = chosen[current];
  clearHighlights();

  [...els.options.children].forEach((li, idx) => {
    if (q.correct.includes(idx)) li.classList.add("correct");
    if (answer.includes(idx) && !q.correct.includes(idx)) li.classList.add("wrong");
  });

  els.status.textContent = "Зелёным подсвечены правильные варианты.";
  els.status.className = "status info";
}

function resetCurrent() {
  chosen[current] = [];
  renderQuestion();
}

function checkAll() {
  let correctCount = 0;
  let answeredCount = 0;

  questions.forEach((q, idx) => {
    const ans = chosen[idx];
    if (ans.length > 0) {
      answeredCount++;
      if (arraysEqual(ans, q.correct)) correctCount++;
    }
  });

  if (answeredCount === 0) {
    els.status.textContent = "Сначала ответь хотя бы на один вопрос 🙂";
    els.status.className = "status info";
    return;
  }

  const percent = Math.round((correctCount / questions.length) * 100);
  els.status.className = "status info";
  els.status.textContent =
    `Итог по тесту: ${correctCount} из ${questions.length} (${percent}%). ` +
    `Отвечено минимум чем-то: ${answeredCount} вопросов.`;
}

els.prev.addEventListener("click", () => {
  if (current > 0) {
    current--;
    renderQuestion();
  }
});
els.next.addEventListener("click", () => {
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  }
});
els.check.addEventListener("click", checkAnswer);
els.reset.addEventListener("click", resetCurrent);
els.showRight.addEventListener("click", showRightAnswer);
els.checkAll.addEventListener("click", checkAll);

renderQuestion();
</script>
</body>
</html>
